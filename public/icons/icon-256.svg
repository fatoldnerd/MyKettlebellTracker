<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg256" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e293b"/>
      <stop offset="100%" style="stop-color:#0f172a"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="256" height="256" fill="url(#bg256)" rx="25"/>
  
  <!-- Kettlebell -->
  <g transform="translate(128, 128)">
    <!-- Handle -->
    <path d="M -40 -40 A 40 40 0 0 1 40 -40" 
          stroke="#ec4899" 
          stroke-width="16" 
          fill="none"/>
    
    <!-- Ball -->
    <circle cx="0" cy="25" r="50" fill="#ec4899"/>
    
    <!-- Highlight -->
    <circle cx="-13" cy="8" r="20" fill="rgba(255,255,255,0.3)"/>
  </g>
  
  <!-- Text -->
  <text x="128" y="220" text-anchor="middle" fill="white" font-family="Arial" font-size="32" font-weight="bold">KB</text>
</svg>